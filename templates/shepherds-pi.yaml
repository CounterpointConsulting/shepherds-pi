version: 1

project:
  name: __PROJECT_NAME__
  repo_path: .
  dev_branch: __DEV_BRANCH__
  main_branch: __MAIN_BRANCH__

docker:
  image: ghcr.io/counterpointconsulting/shepherds-pi-agent:latest
  working_dir: /workspace/repo

openrouter:
  api_key: ${OPENROUTER_API_KEY}

coordinator:
  model: openrouter/anthropic/claude-sonnet-4
  thinking_level: high

personas_dir: ./.shepherds-pi/personas

agent:
  timeout_minutes: 30
  max_retries: 1
  git_token_env: GIT_TOKEN

git:
  repo_mode: worktree
  git_ops_mode: host
  worktrees_dir: ./.shepherds-pi/worktrees
  author_name: Shepherds Pi Agent
  author_email: agent@shepherds-pi.dev
  reset_worktree_before_run: true
  # Worktree branch-lease tuning (worktree mode). A branch maps to one worktree,
  # so only one agent can hold a branch at a time; contending spawns wait.
  lease_wait_timeout_seconds: 900   # max wait for a busy branch before failing (0 = fail fast)
  lease_wait_poll_seconds: 3        # poll interval while waiting
  acquire_step_timeout_seconds: 90  # per-step timeout for git ops during acquire

# Beads work-graph integration (default off until enabled per project)
beads:
  enabled: false
  binary: bd
  repo_path: .
  require_bead_on_spawn: true
  stuck_dispatch_limit: 10
  actor: shepherds-coordinator
